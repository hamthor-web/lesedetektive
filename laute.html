<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesedetektive · Was zischt den da</title><link rel="icon" href="icon.svg"><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#243242;background:#f5f2e9}*{box-sizing:border-box}body{margin:0;padding:14px}.app{max-width:740px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:21px;font-weight:850}.sub{color:#627080;font-size:13px}.progress{display:flex;gap:4px;margin:13px 0 16px}.progress i{height:8px;flex:1;background:#dddcd3;border-radius:10px}.progress i.current{background:#6494ce}.progress i.done{background:#64ad80}.card{border:1px solid #ddd8cc;background:white;border-radius:23px;padding:20px;box-shadow:0 8px 30px #1f293715}.eyebrow{font-size:12px;color:#66778b;letter-spacing:.09em;font-weight:800;text-align:center;text-transform:uppercase}.reading{min-height:160px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:17px;padding:12px 0 20px}.duel{display:flex;gap:15px;justify-content:center;align-items:center;flex-wrap:wrap}.duel span{font-weight:850;font-size:clamp(34px,7vw,58px);background:#f2f5fa;padding:13px 20px;border-radius:16px}.duel span:nth-child(1){color:#2874ad}.duel span:nth-child(2){color:#ad6c21}.readline{text-align:center;font-size:clamp(24px,4.5vw,33px);font-weight:700;line-height:1.5}.readline.small{font-size:clamp(20px,3.8vw,26px)}.actions{display:flex;justify-content:center;gap:65px;margin:14px 0}.circle{width:84px;height:84px;border:0;border-radius:50%;font-size:38px;color:white;font-weight:bold;box-shadow:0 5px 0 #0002;cursor:pointer;touch-action:manipulation}.red{background:#d44747}.green{background:#21975a}.caption{text-align:center;font-size:13px;color:#66717d}.flag{font-size:13px;text-align:center;color:#9a581f;margin:8px}.searchwords{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;padding:13px 0}.word{border:2px solid #d7dce5;background:#f0f3f7;color:#4c5662;border-radius:12px;min-width:80px;padding:11px 12px;font-size:clamp(16px,3vw,22px);font-weight:750;transition:transform .2s,background .2s;position:relative}.word.active{background:#fff1bc;border-color:#c58c20;color:#34312b;transform:scale(1.12);box-shadow:0 4px 10px #a67a2433;z-index:2}.word.found{background:#e5f3eb;border-color:#77b58a;color:#426e50}.word.found:after{content:' ✓'}.word.jump{animation:jump .5s ease}@keyframes jump{40%{transform:translateY(-13px) scale(1.15)}70%{transform:translateY(1px)}}.scene{position:relative;width:100%;aspect-ratio:1.28;border:3px solid #e2dacb;border-radius:19px;overflow:hidden;background:linear-gradient(#cfe9f5 0 58%,#acd498 58% 100%)}.scene.winter{background:linear-gradient(#bddff3 0 54%,#f3f9fc 54% 100%)}.scene.field{background:linear-gradient(#d3effd 0 50%,#9dd18c 50% 100%)}.scene.room{background:linear-gradient(#fbe9d6 0 65%,#d9b895 65%)}.scene.pond{background:linear-gradient(#b5e6f7 0 48%,#92cd77 48% 65%,#65b6d7 65%)}.scene.space{background:linear-gradient(#bde7fb 0 50%,#b7dba0 50%)}.scene:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 87% 15%,#ffe188 0 5%,transparent 5.3%),radial-gradient(ellipse at 12% 22%,#fff9 0 8%,transparent 8.5%)}.object{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid transparent;background:none;border-radius:20px;font-size:clamp(26px,6vw,54px);line-height:1.1;min-width:40px;min-height:40px;transform:translate(-50%,-50%);cursor:pointer;touch-action:manipulation;padding:2px;user-select:none}.object.big{font-size:clamp(50px,11vw,98px)}.object.sm{font-size:clamp(24px,4.5vw,39px)}.object.found{background:#e8ffde99;border-color:#319d66}.object.found:after{content:'✓';position:absolute;right:-5px;top:-9px;color:white;background:#289552;border-radius:50%;font-size:15px;padding:4px}.object.wrong{animation:shake .32s}@keyframes shake{0%,100%{translate:0}30%{translate:-5px}70%{translate:5px}}.object:focus-visible,.circle:focus-visible,.nav:focus-visible{outline:4px solid #1467be}.notice{font-size:14px;min-height:38px;text-align:center;padding:10px 0;color:#456274}.nav{background:#385f8e;border:0;border-radius:12px;color:white;font-size:17px;font-weight:750;padding:13px 22px;cursor:pointer}.nav.secondary{background:#e8ebef;color:#34475a}.bottom{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.end{text-align:center;display:grid;gap:13px;justify-items:center;padding:35px 5px}.end .medal{font-size:65px}.helper{margin-top:13px;font-size:13px;color:#627080;text-align:center}button:disabled{opacity:.45;cursor:default}@media(max-width:420px){body{padding:7px}.card{padding:13px}.circle{width:76px;height:76px}.actions{gap:46px}.word{min-width:68px;padding:8px}}
a{color:#21655b}h1{font-size:28px}.brand{color:#21655b}</style></head><body><main class="app"><header class="top"><div class="brand">Was zischt den da</div><div id="counter" class="sub"></div></header><p><a href="index.html">← Spielauswahl</a></p><button id="menuButton" class="nav secondary">Übungsauswahl</button><div id="progress" class="progress"></div><section id="menu" class="card"><h1>Was zischt den da</h1><p>Zischlaute erkennen und richtig lesen</p><p>Lies, höre und vergleiche gemeinsam mit deiner Begleitperson. Du kannst jedes Wort erneut versuchen.</p><div style="display:grid;gap:16px"><button class="nav" onclick="startSort()">CH oder SCH? · Wörter sortieren</button><button class="nav" onclick="startFamily()">Wie klingt es?<br>ich oder ach?</button></div><p class="helper">Ohne Zeitlimit. Vorlesen ist möglich, wenn dein Browser eine passende Stimme bereitstellt.</p></section><section id="newgame" class="card hidden"><div id="newcontent"></div><p id="feedback" class="notice" aria-live="polite"></p></section></main><script>
const $=id=>document.getElementById(id);
const shuffle=a=>{let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
function show(which){for(const id of ['menu','newgame'])$(id).classList.toggle('hidden',id!==which)}
const soft=["ich","sich","weichen","sichern","mich","dich","Licht","Gesicht","Becher","weich","Sträucher","Fläche","Fächer","Nächte","echt","Wächter","lächeln","sprechen","schwächer","räuchern","Tücher","Küche","Bräuche","Köche"];
const rough=["ach","Bach","wach","krachen","wachen","Sachen","machen","Dach","Fach","lachen","suchen","Buch","Tuch","Strauch","flach","Nacht","acht","Sprache","schwach","Rauch","Kuchen","brauchen","kochen"];
const sh=['mischen','wischen','matschen','Schein','scheuen','Asche','Fisch','Tisch','Tasche','waschen','Masche','Schule'];
const families=[["Bach","Bäche","Ein Bach fließt. Zwei Bäche fließen."],["Buch","Bücher","Ein Buch liegt auf dem Tisch. Daneben liegen zwei Bücher."],["Loch","Löcher","Ein Loch ist im Käse. Der andere Käse hat viele Löcher."],["Dach","Dächer","Ein Dach ist rot. Die anderen Dächer sind blau."],["Bauch","Bäuche","Ein Bauch knurrt. Nach dem Essen sind die Bäuche voll."],["Strauch","Sträucher"],["flach","Fläche"],["Fach","Fächer"],["Nacht","Nächte"],["acht","echt"],["wachen","Wächter"],["lachen","lächeln"],["Sprache","sprechen"],["schwach","schwächer"],["wach","weich"],["Rauch","räuchern"],["Tuch","Tücher"],["Kuchen","Küche"],["brauchen","Bräuche"],["kochen","Köche"]];
let queue=[],qi=0,kind='',locked=false,selected=null,familyQuestion='ich';
function speakWord(word){if(!('speechSynthesis' in window)){feedback('Hier ist keine Vorlesestimme verfügbar. Bitte lass dir das Wort vorlesen.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='de-DE';u.rate=.78;speechSynthesis.speak(u)}
function feedback(t){$('feedback').textContent=t}
function home(){if('speechSynthesis' in window)speechSynthesis.cancel();show('menu');$('counter').textContent='';$('progress').innerHTML=''}
$('menuButton').onclick=home;

function startSort(){kind='sort';queue=shuffle([...soft.map(w=>[w,'soft']),...rough.map(w=>[w,'rough']),...sh.map(w=>[w,'sh'])]);qi=0;renderNew()}
function startFamily(){kind='family';qi=0;renderNew()}
function newProgress(total){$('counter').textContent=(qi+1)+' / '+total;$('progress').innerHTML=Array.from({length:total},(_,i)=>'<i class="'+(i<qi?'done':i===qi?'current':'')+'"></i>').join('')}
function renderNew(){locked=false;selected=null;show('newgame');feedback('');if(kind==='sort'){newProgress(queue.length);let w=queue[qi][0];$('newcontent').innerHTML='<div class="eyebrow">CH oder SCH?</div><p>Lies das Wort laut. Wie klingt es?</p><div class="reading"><div class="readline" style="font-size:48px">'+w+'</div><button class="nav secondary" id="hear">🔊 Wort hören</button></div><div style="display:grid;gap:12px"><button class="nav" onclick="answer(\'soft\')">CH wie in ich</button><button class="nav" onclick="answer(\'rough\')">CH wie in ach</button><button class="nav" onclick="answer(\'sh\')">SCH wie in Schule</button></div><button class="nav hidden" id="continue" style="margin-top:18px" onclick="advance()">Weiter →</button>';$('hear').onclick=()=>speakWord(w)}else{newProgress(families.length);familyQuestion=Math.random()<.5?'ich':'ach';let f=families[qi];$('newcontent').innerHTML='<div class="eyebrow">Wie klingt es?<br>ich oder ach?</div><h2>Lies beide Wörter.</h2><div class="duel">'+f.slice(0,2).map((w,i)=>'<button class="nav secondary" style="font-size:36px" onclick="speakWord(families[qi]['+i+'])">'+w+' 🔊</button>').join('')+'</div>'+(f[2]?'<p class="readline small">'+f[2]+'</p>':'')+'<p>In welchem Wort klingt <strong>ch</strong> wie in <strong>'+familyQuestion+'</strong>?</p><div class="duel">'+f.slice(0,2).map((w,i)=>'<button class="nav" onclick="familyAnswer('+i+')">'+w+'</button>').join('')+'</div><div id="discovery" class="hidden"><p class="readline small">'+f[0]+' → '+f[1]+'</p><p>Die Buchstaben <strong>ch</strong> bleiben gleich. Sprich beide Wörter noch einmal und achte auf den Buchstaben davor.</p><button class="nav" onclick="advance()">Weiter →</button></div>'}}
function answer(group){if(locked)return;if(group!==queue[qi][1]){feedback('Hör noch einmal genau hin. Sprich das Wort zusammen mit deiner Begleitperson. Du kannst es erneut versuchen.');return}locked=true;feedback('✓ Richtig zugeordnet!');$('continue').classList.remove('hidden')}
function familyAnswer(i){if(locked)return;const correct=familyQuestion==='ich'?1:0;if(i!==correct){feedback('Sprich beide Wörter noch einmal. Suche den Klang wie in „'+familyQuestion+'“.');return}locked=true;feedback('✓ Genau! '+families[qi][correct]+' hat den '+(familyQuestion==='ich'?'Ich':'Ach')+'-Laut.');$('discovery').classList.remove('hidden')}
function advance(){qi++;let total=kind==='sort'?queue.length:families.length;if(qi<total){renderNew();return}show('newgame');$('counter').textContent=total+' / '+total;$('progress').innerHTML=Array.from({length:total},()=>'<i class="done"></i>').join('');feedback('');$('newcontent').innerHTML='<div class="end"><div class="medal">🌟</div><h1>Alles entdeckt!</h1><p>'+ (kind==='sort'?'Du hast alle '+total+' Wörter zugeordnet.':'Du hast alle '+total+' Wortpaare verglichen und den Ich-Laut und Ach-Laut entdeckt.')+'</p><button class="nav" onclick="'+(kind==='sort'?'startSort()':'startFamily()')+'">Noch eine Runde</button><button class="nav secondary" onclick="home()">Zur Spielauswahl</button></div>'}
home();

</script></body></html>
